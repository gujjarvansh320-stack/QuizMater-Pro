version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://db:27017/quizmaster
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
    depends_on:
      - db

  quiz-client:
    build:
      context: ./quiz-client
      args:
        REACT_APP_BASE_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data: